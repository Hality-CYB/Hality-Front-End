name: CI Pipeline - hality-front

on:
  pull_request:
    branches:
      - develop
      - main
      - "test/e2e-*"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & Code Style
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run Prettier format check
        run: npm run format:check

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run test

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run build
        run: npm run build
        env:
          # Build de integração: sem mock, igual a homologação e produção.
          NEXT_PUBLIC_API_MOCKING: disabled

  e2e:
    name: E2E Chromium
    runs-on: ubuntu-latest
    needs: [test, build]
    timeout-minutes: 30
    permissions:
      contents: read
    defaults:
      run:
        working-directory: frontend
    env:
      CI: "true"
      COMPOSE_PROJECT_NAME: hality-e2e-${{ github.run_id }}-${{ github.run_attempt }}
      COMPOSE_FILE: e2e/compose.yml
      BACKEND_PATH: ${{ github.workspace }}/backend
    steps:
      - uses: actions/checkout@v4
        with:
          path: frontend
          persist-credentials: false

      - uses: actions/checkout@v4
        with:
          repository: Hality-CYB/Hality-Back-End
          ref: develop
          path: backend
          persist-credentials: false

      - name: Registrar revisões testadas
        run: |
          {
            echo "### E2E - revisões"
            echo "Front-end: $(git rev-parse HEAD)"
            echo "Back-end: $(git -C "$BACKEND_PATH" rev-parse HEAD)"
            echo "Next production, MSW disabled, PostgreSQL 17, IA determinística, email noop."
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Instalar Chromium e dependências do sistema
        run: npx playwright install --with-deps chromium

      - name: Subir ambiente descartável com migrações e seed
        run: docker compose up --build --wait --wait-timeout 180

      - name: Executar fluxos no Chromium headless
        run: npx playwright test

      - name: Publicar relatório e evidências Playwright
        id: playwright-report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report/
            frontend/test-results/junit.xml
            frontend/test-results/results.json
          retention-days: 7

      - name: Resumir resultados
        if: always()
        env:
          E2E_ARTIFACT_URL: ${{ steps.playwright-report.outputs.artifact-url }}
        run: node e2e/ci/report.mjs

      - name: Coletar logs dos containers em caso de falha
        if: failure()
        run: docker compose logs --no-color > container-logs.txt 2>&1

      - name: Publicar logs dos containers
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-container-logs
          path: frontend/container-logs.txt
          retention-days: 7

      - name: Remover containers e volumes deste job
        if: always()
        run: docker compose down --volumes --remove-orphans
